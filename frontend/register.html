<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - TaniKuy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container card">
        <div class="brand auth-brand">
            <span class="brand-icon">🌱</span>
            <h2>MyTani</h2>
        </div>
        <h3>Registrasi Akun Petani</h3>
        <p class="subtitle">Daftarkan akun baru untuk mulai memantau lahan pertanian Anda.</p>

        <form id="register-form" novalidate autocomplete="off">
            <div class="form-group">
                <label for="reg-username">Nama Lengkap / Username *</label>
                <input type="text" id="reg-username" placeholder="Masukkan username" autocomplete="off">
                <small class="error-text"></small>
            </div>

            <div class="form-group">
                <label for="reg-email">Alamat Email *</label>
                <input type="email" id="reg-email" placeholder="Masukkan alamat email" autocomplete="off">
                <small class="error-text"></small>
            </div>

            <div class="form-group">
                <label for="reg-password">Kata Sandi *</label>
                <input type="password" id="reg-password" placeholder="Minimal 6 karakter" autocomplete="off">
                <small class="error-text"></small>
            </div>

            <div class="form-group">
                <label for="reg-confirm-password">Konfirmasi Kata Sandi *</label>
                <input type="password" id="reg-confirm-password" placeholder="Ulangi kata sandi" autocomplete="off">
                <small class="error-text"></small>
            </div>

            <button type="submit" class="btn btn-success btn-block">Daftar Akun Baru ✨</button>
        </form>

        <div id="form-feedback" class="feedback-msg"></div>

        <p class="auth-footer">
            Sudah memiliki akun? <a href="index.html">Masuk Sekarang</a>
        </p>
    </div>

    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
